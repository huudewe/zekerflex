<!DOCTYPE html>
<html lang="nl">
<head>
	<link rel="stylesheet" href="zf-atmosphere.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZekerFlex - Persoonlijke instellingen</title>
<link rel="icon" type="image/svg+xml" href="zekerflex-logo.jpeg">
<style>
:root{--navy:#11145f;--ink:#202027;--line:#e7e8ed;--aqua:#19c5b6}*{box-sizing:border-box}body{margin:0;background:#f8f9fc;color:var(--ink);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:220px;flex:0 0 220px;background:linear-gradient(#11145f,#0e1254);display:flex;flex-direction:column;align-items:stretch;padding:24px 10px}.brand{width:100%;height:34px;display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 8px;color:#fff;font-weight:700}.brand img{width:27px;background:#fff;border-radius:6px}.sidebar-toggle{height:30px;margin:0 0 8px;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer;font-weight:700}.sidebar-toggle svg{width:20px;height:20px;margin-right:8px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2}.sidebar-quick,.side-button{width:100%;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border:1px solid transparent;border-radius:9px;background:transparent;color:#d8d9fb;text-align:left;font-weight:700;cursor:pointer}.sidebar-quick svg,.side-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.sidebar-quick:hover,.side-button:hover,.side-button.active{background:#292e85;border-color:#5960b5;color:#fff}.side-nav{display:grid;gap:10px;padding-top:10px;border-top:1px solid #40458e}.sidebar-bottom{display:grid;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid #40458e}.workspace{min-width:0;flex:1}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.company-name{font-weight:700}.rating{margin-left:18px;color:#c9cad0;letter-spacing:2px;text-decoration:none}.rating small{color:#3897be;letter-spacing:0}.top-actions{display:flex;align-items:center;gap:12px}.top-actions select,.top-actions button{height:38px;border:1px solid #dedfe5;background:#fff;border-radius:5px;padding:0 13px;color:#555}.content{max-width:1260px;margin:auto;padding:38px 42px 72px}.page-head{padding:8px 0 34px}.page-head h1{margin:0 0 13px;color:#343b64;font-size:21px}.back-link{color:#3897be;font-size:12px;text-decoration:none}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{padding:25px 28px;background:#fff;border:1px solid #edf0f4;box-shadow:0 3px 16px rgba(37,48,90,.03)}.panel h2{margin:0 0 20px;color:#3f486f;font-size:17px}.form-grid{display:grid;gap:15px}.form-grid label{display:grid;gap:6px;color:#737a86;font-size:12px;font-weight:700}.form-grid input,.form-grid select{height:38px;border:1px solid #dfe1e7;border-radius:4px;padding:0 10px;background:#fff;color:#303038}.save{margin-top:20px;border:0;border-radius:4px;background:#19c5b6;padding:11px 16px;color:#fff;font-weight:700;cursor:pointer}.status{display:block;margin-top:10px;color:#168d87;font-size:12px}@media(max-width:700px){.sidebar{width:72px;flex-basis:72px;padding:18px 7px}.brand{padding:0;justify-content:center}.brand span,.sidebar-toggle span,.sidebar-quick span,.side-button span{display:none}.sidebar-toggle{text-align:center}.sidebar-quick,.side-button{width:52px;padding:0;justify-content:center}.content{padding:24px 16px}.topbar{padding:0 14px}.company-name{display:none}.rating{margin:0}.settings-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" aria-label="Werkgeversmenu"><a class="brand" href="dashboard.html?demo=bedrijf"><img src="zekerflex-logo.jpeg" alt="ZekerFlex"><span>ZekerFlex</span></a><button class="sidebar-toggle" type="button"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M10 12h8"></path></svg><span>Inklappen</span></button><button class="sidebar-quick" type="button" title="Jouw start"><svg viewBox="0 0 24 24"><path d="M14.5 4.5c2.4-1.1 4.3-1.1 5-1.1 0 .7 0 2.6-1.1 5l-7.8 7.8-3.6.4.4-3.6 7.1-8.5Z"></path><path d="m7 16-3 3M13 18l-1 3M6 11l-3 1"></path><circle cx="16.5" cy="7.5" r="1"></circle></svg><span>Jouw start</span></button><nav class="side-nav"><button class="side-button" title="Klussen"><span>▤</span><span>Klussen</span></button><button class="side-button" title="Planning"><span>□</span><span>Planning</span></button><button class="side-button" title="Favorieten"><span>♡</span><span>Favorieten</span></button><button class="side-button" title="Chat"><span>▱</span><span>Chat</span></button><button class="side-button" title="Geblokkeerd"><span>⊘</span><span>Geblokkeerd</span></button></nav><div class="sidebar-bottom"><button class="side-button active" title="Instellingen"><span>⚙</span><span>Instellingen</span></button><button class="side-button" title="Uitloggen"><span>↪</span><span>Uitloggen</span></button></div></aside><div class="workspace"><header class="topbar"><div><span class="company-name">Demo account</span><a class="rating" href="reviews.html">★★★★★ <small>(0 reviews)</small></a></div><div class="top-actions"><select aria-label="Taal"><option>Nederlands (NL)</option><option>English (EN)</option></select><button title="Help">?</button><button type="button" class="account-button">Mijn account v</button></div></header><main class="content"><section class="page-head"><h1>PERSOONLIJKE INSTELLINGEN</h1><a class="back-link" href="dashboard.html?demo=bedrijf#settingsView">←&nbsp; Ga terug</a></section><div class="settings-grid"><section class="panel"><h2>Mijn gegevens</h2><div class="form-grid"><label>Voor- en achternaam<input value="Demo account"></label><label>E-mailadres<input type="email" value="demo@demohoreca.nl"></label><label>Telefoonnummer<input value="06 56777843"></label></div><button class="save" type="button">Wijzigingen opslaan</button><small class="status" hidden>Wijzigingen opgeslagen.</small></section><section class="panel"><h2>Accountvoorkeuren</h2><div class="form-grid"><label>Taal<select><option>Nederlands (NL)</option><option>English (EN)</option></select></label><label>Tijdzone<select><option>Europe/Amsterdam</option><option>Europe/Brussels</option></select></label></div><button class="save" type="button">Voorkeuren opslaan</button><small class="status" hidden>Voorkeuren opgeslagen.</small></section></div></main></div></div>
<script>document.querySelectorAll('.save').forEach((button) => button.addEventListener('click', () => { const status = button.nextElementSibling; status.hidden = false; })); document.querySelector('.sidebar-toggle').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('is-expanded')); document.querySelectorAll('.sidebar [title]').forEach((button) => button.addEventListener('click', () => { const routes = { 'Jouw start':'dashboard.html?demo=bedrijf', Klussen:'dashboard.html?demo=bedrijf&view=jobs', Planning:'dashboard.html?demo=bedrijf&view=calendar', Favorieten:'dashboard.html?demo=bedrijf&view=candidates&filter=favorites', Chat:'communicatie.html?demo=bedrijf', Geblokkeerd:'dashboard.html?demo=bedrijf&view=blocked', Instellingen:'personal-settings.html', Uitloggen:'login.html?role=opdrachtgever' }; if (routes[button.title]) location.href = routes[button.title]; })); document.querySelector('.account-button').addEventListener('click', () => { const button = document.querySelector('.account-button'); if (document.querySelector('.account-menu')) { document.querySelector('.account-menu').remove(); return; } button.insertAdjacentHTML('afterend', '<div class="account-menu" style="position:absolute;z-index:20;right:28px;top:68px;display:grid;min-width:190px;padding:6px;background:#fff;border:1px solid #dfe1e7;border-radius:5px;box-shadow:0 5px 14px rgba(15,23,42,.12)"><a href="personal-settings.html" style="padding:10px;color:#596273;text-decoration:none;font-size:12px">Persoonlijke instellingen</a><a href="notifications.html" style="padding:10px;color:#596273;text-decoration:none;font-size:12px">Notificatievoorkeuren</a><a href="login.html?role=opdrachtgever" style="padding:10px;color:#596273;text-decoration:none;font-size:12px">Uitloggen</a></div>'); });</script>
</body>
</html>
