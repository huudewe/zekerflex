<title>ZekerFlex - Reviews</title>

<style>
:root{--navy:#11145f;--ink:#202027;--line:#e7e8ed;--aqua:#19c5b6}*{box-sizing:border-box}body{margin:0;background:#f8f9fc;color:var(--ink);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:76px;flex:0 0 76px;background:linear-gradient(#11145f,#0e1254);display:flex;flex-direction:column;align-items:center;padding:24px 10px;transition:width .2s ease,flex-basis .2s ease}.brand{width:34px;height:34px;display:grid;place-items:center;margin-bottom:10px;background:#fff;border-radius:6px}.brand img{width:27px}.sidebar-toggle{width:34px;height:26px;margin:0 auto 8px;border:1px solid #5960b5;border-radius:6px;background:#292e85;color:#fff;cursor:pointer}.sidebar-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s ease}.sidebar-quick{position:relative;width:52px;height:52px;margin:0 auto 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:#d8d9fb;cursor:pointer}.sidebar-quick svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.sidebar-quick:after{content:attr(title);display:none}.sidebar-quick:hover,.side-button:hover{background:#292e85;border-color:#5960b5;color:#fff}.side-nav,.sidebar-bottom{display:grid;gap:10px;width:100%}.side-nav{padding-top:10px;border-top:1px solid #40458e}.sidebar-bottom{margin-top:auto;padding-top:14px;border-top:1px solid #40458e}.side-button{width:52px;height:52px;margin:auto;border:1px solid transparent;border-radius:9px;color:#d8d9fb;background:transparent;cursor:pointer}.side-button svg{width:21px;height:21px;display:block;margin:auto;fill:none;stroke:currentColor;stroke-width:1.8}.workspace{min-width:0;flex:1}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.company-name{font-weight:700}.rating{margin-left:18px;color:#c9cad0;letter-spacing:2px;text-decoration:none}.rating small{color:#3897be;letter-spacing:0}.top-actions{display:flex;align-items:center;gap:12px}.top-actions select,.top-actions button{height:38px;border:1px solid #dedfe5;background:#fff;border-radius:5px;padding:0 13px;color:#555}.content{max-width:1260px;margin:auto;padding:38px 42px 72px}.reviews-header{padding:42px 0 34px}.reviews-header h1{margin:0 0 13px;color:#343b64;font-size:21px;letter-spacing:.2px}.back-link{color:#3897be;font-size:12px;text-decoration:none}.review-panel{margin:0 6px;padding:28px 30px 30px;background:#fff;border:1px solid #edf0f4;box-shadow:0 3px 16px rgba(37,48,90,.03)}.review-panel h2{margin:0 0 27px;color:#3f486f;font-size:17px}.review-meta{display:flex;align-items:center;gap:18px;color:#8a8f9b;font-size:12px}.calendar-icon{width:14px;height:14px;border:1px solid #e5aeb9;color:#e5aeb9;display:inline-grid;place-items:center;font-size:8px}.stars{margin-top:24px;color:#c6cacf;font-size:19px;letter-spacing:1px}.review-count{margin-left:10px;color:#303858;font-size:12px;font-weight:700;letter-spacing:0}@media(max-width:600px){.sidebar{width:62px;flex-basis:62px;padding-left:5px;padding-right:5px}.side-button{width:46px}.topbar{padding:0 14px}.company-name{display:none}.rating{margin-left:0}.content{padding:22px 16px}.reviews-header{padding:28px 0 25px}.review-panel{margin:0;padding:24px 20px}}
</style>
<style>
.sidebar{width:220px;flex-basis:220px;align-items:stretch}.sidebar .brand{margin-left:8px}.sidebar .sidebar-toggle{width:100%;text-align:left}.sidebar .sidebar-toggle svg{transform:rotate(180deg)}.sidebar .sidebar-quick,.sidebar .side-button{width:100%;display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left}.sidebar .sidebar-quick:after,.sidebar .side-button:after{content:attr(title);display:block;font-size:13px;font-weight:700}.sidebar .side-button svg,.sidebar .sidebar-quick svg{margin:0}.sidebar .side-nav{padding-top:0;border-top:0}.sidebar.is-expanded{width:220px;flex-basis:220px}.sidebar:not(.is-expanded){width:76px;flex-basis:76px;align-items:center}.sidebar:not(.is-expanded) .brand{margin-left:0}.sidebar:not(.is-expanded) .sidebar-toggle{width:34px;text-align:center}.sidebar:not(.is-expanded) .sidebar-toggle svg{transform:none}.sidebar:not(.is-expanded) .sidebar-quick,.sidebar:not(.is-expanded) .side-button{width:52px;display:block;padding:0;text-align:center}.sidebar:not(.is-expanded) .sidebar-quick:after,.sidebar:not(.is-expanded) .side-button:after{display:none}.sidebar:not(.is-expanded) .side-button svg,.sidebar:not(.is-expanded) .sidebar-quick svg{margin:auto}
.sidebar.is-expanded{width:220px;flex-basis:220px;align-items:stretch}.sidebar.is-expanded .brand{margin-left:8px}.sidebar.is-expanded .sidebar-toggle{width:100%;text-align:left}.sidebar.is-expanded .sidebar-toggle svg{transform:rotate(180deg)}.sidebar.is-expanded .sidebar-quick,.sidebar.is-expanded .side-button{width:100%;display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left}.sidebar.is-expanded .sidebar-quick:after,.sidebar.is-expanded .side-button:after{content:attr(title);font-size:13px;font-weight:700}.sidebar.is-expanded .side-button svg,.sidebar.is-expanded .sidebar-quick svg{margin:0}.sidebar.is-expanded .side-nav{padding-top:0;border-top:0}
.reviews-list{display:grid;gap:12px;margin-top:24px}.review-item{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-top:1px solid #edf0f4}.review-item strong,.review-item small{display:block}.review-item small{margin-top:6px;color:#858b96;line-height:1.45}.review-item-rating{white-space:nowrap;font-size:16px;letter-spacing:1px}.review-item-rating .stars-gold,.stars-gold{color:#f5b942}.review-item-rating .stars-empty,.stars-empty{color:#c6cacf}.review-item-rating b{margin-left:8px;color:#303858;font-size:12px;letter-spacing:0}@media(max-width:600px){.review-item{display:block}.review-item-rating{margin-top:10px}}
</style>
</head>
<style>.account-wrap{position:relative}.account-button{cursor:pointer}.account-menu{position:absolute;z-index:20;top:calc(100% + 7px);right:0;display:grid;min-width:180px;padding:5px;background:#fff;border:1px solid #dfe1e7;border-radius:5px;box-shadow:0 5px 14px rgba(15,23,42,.12)}.account-menu[hidden]{display:none}.account-menu button{height:34px;border:0;background:#fff;padding:0 10px;color:#596273;text-align:left;font-size:12px;cursor:pointer}.account-menu button:hover{background:#eefaf8;color:#168d87}</style>
<body>
<div class="app">
<aside class="sidebar" aria-label="Werkgeversmenu"><a class="brand" href="dashboard.html" title="ZekerFlex home"><img src="zekerflex-logo.jpeg" alt="ZekerFlex"></a><button class="sidebar-toggle" type="button" aria-label="Zijbalk uitklappen" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7M10 12h8"></path></svg></button><button class="sidebar-quick" type="button" title="Jouw start" aria-label="Jouw start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5c2.4-1.1 4.3-1.1 5-1.1 0 .7 0 2.6-1.1 5l-7.8 7.8-3.6.4.4-3.6 7.1-8.5Z"></path><path d="m7 16-3 3M13 18l-1 3M6 11l-3 1"></path><circle cx="16.5" cy="7.5" r="1"></circle></svg></button><nav class="side-nav"><button class="side-button" title="Klussen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button><button class="side-button" title="Planning"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg></button><button class="side-button" title="Kandidaten"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c.7-3 2.5-4.5 5.5-4.5s4.8 1.5 5.5 4.5M16 10l2 2 3-4"></path></svg></button><button class="side-button" title="Geblokkeerd"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m7 7 10 10"></path></svg></button></nav><div class="sidebar-bottom"><button class="side-button" title="Instellingen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.6-1H6v-2.5h.4A1.7 1.7 0 0 0 8 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.5V5a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V13h-.1a1.7 1.7 0 0 0-1.6 1.9z"></path></svg></button><button class="side-button" title="Uitloggen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M9 12h9"></path></svg></button></div></aside>
<div class="workspace"><header class="topbar"><div><span class="company-name">Demo Horeca BV</span><a class="rating" href="reviews.html" aria-label="Reviews bekijken">***** <small>(0 reviews)</small></a></div><div class="top-actions"><select aria-label="Taal"><option>Nederlands (NL)</option><option>English (EN)</option></select><button title="Help">?</button><button>O Werkgever v</button></div></header>
<main class="content"><section class="reviews-header"><h1>REVIEWS</h1><a class="back-link" href="dashboard.html?demo=bedrijf#settingsView">←&nbsp; Ga terug</a></section><section class="review-panel"><h2>Algemene informatie</h2><div class="review-meta"><span class="calendar-icon">□</span><span>heeft een betalingstermijn van dagen.</span></div><div class="stars" data-review-summary aria-label="Reviews">★★★★★ <span class="review-count">(0 reviews)</span></div><div class="reviews-list" data-reviews-list></div></section></main></div>
</div>
</body>
<script>String.prototype.toFixed = function (digits) { return Number(String(this).replace(',', '.')).toFixed(digits); };</script>
<script>const reviewNav = document.querySelector('.side-nav'); const blockedButton = reviewNav.querySelector('[title="Geblokkeerd"]'); const favoriteButton = document.createElement('button'); favoriteButton.className = 'side-button'; favoriteButton.type = 'button'; favoriteButton.title = 'Favorieten'; favoriteButton.setAttribute('aria-label', 'Favorieten'); favoriteButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20S4 15.5 4 9.5A4 4 0 0 1 12 8a4 4 0 0 1 8 1.5C20 15.5 12 20 12 20Z"></path></svg>'; const chatButton = document.createElement('button'); chatButton.className = 'side-button'; chatButton.type = 'button'; chatButton.title = 'Chat'; chatButton.setAttribute('aria-label', 'Chat'); chatButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h7A3.5 3.5 0 0 1 19 6.5v5a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 4v-4.3A3.5 3.5 0 0 1 5 11.5v-5Z"></path><path d="M9 8h6M9 11h4"></path></svg>'; reviewNav.insertBefore(favoriteButton, blockedButton); reviewNav.insertBefore(chatButton, blockedButton); const reviewSidebar = document.querySelector('.sidebar'); const reviewSidebarToggle = document.querySelector('.sidebar-toggle'); reviewSidebar.classList.add('is-expanded'); reviewSidebarToggle.setAttribute('aria-expanded', 'true'); reviewSidebarToggle.setAttribute('aria-label', 'Zijbalk inklappen'); reviewSidebarToggle.addEventListener('click', () => { const expanded = reviewSidebar.classList.toggle('is-expanded'); reviewSidebarToggle.setAttribute('aria-expanded', String(expanded)); reviewSidebarToggle.setAttribute('aria-label', expanded ? 'Zijbalk inklappen' : 'Zijbalk uitklappen'); }); chatButton.addEventListener('click', () => { window.location.href = 'communicatie.html?demo=bedrijf'; }); const fallbackReviews = [{name:'Anna Jansen',score:'5,0',text:'Duidelijke communicatie en een prettige samenwerking.'},{name:'Mark de Boer',score:'4,0',text:'Fijne planning. De afspraken waren vooraf helder.'},{name:'Fatima El Amrani',score:'5,0',text:'Goede begeleiding tijdens de dienst en snelle reactie.'},{name:'Lotte Visser',score:'4,5',text:'Flexibel team en een goede overdracht op locatie.'},{name:'Youssef Bakker',score:'4,0',text:'Prettige werkgever, betalingen waren netjes op tijd.'}]; const storedReviews = JSON.parse(localStorage.getItem('zf_employer_reviews') || 'null'); const reviews = Array.isArray(storedReviews) && storedReviews.length ? storedReviews : fallbackReviews; const reviewList = document.querySelector('[data-reviews-list]'); const reviewSummary = document.querySelector('[data-review-summary]'); const average = reviews.reduce((total, review) => total + Number(String(review.score || review.stars || 0).replace(',', '.')), 0) / reviews.length; reviewSummary.firstChild.textContent = '★★★★★ '; reviewSummary.querySelector('.review-count').textContent = `(${reviews.length} reviews)`; reviewList.innerHTML = reviews.map((review) => `<article class="review-item"><div><strong>${review.name || 'Flexkracht'}</strong><small>${review.text || 'Geen toelichting toegevoegd.'}</small></div><span class="review-item-rating">★★★★★ <b>${Number(String(review.score || review.stars || 0).toFixed(1)).toString().replace('.', ',')}</b></span></article>`).join('');</script>
<script>const reviewCountSource = JSON.parse(localStorage.getItem('zf_employer_reviews') || 'null'); const visibleReviewCount = Array.isArray(reviewCountSource) && reviewCountSource.length ? reviewCountSource.length : 5; const reviewScore = (value) => Math.max(0, Math.min(5, Number(String(value || 0).replace(',', '.')))); const reviewStars = (value) => { const rounded = Math.floor(reviewScore(value)); return `<span class="stars-gold">${'★'.repeat(rounded)}</span><span class="stars-empty">${'★'.repeat(5 - rounded)}</span>`; }; const updateReviewDisplay = () => { const reviewItems = [...document.querySelectorAll('.review-item')]; const scores = reviewItems.map((item) => reviewScore(item.querySelector('.review-item-rating b')?.textContent)); const count = scores.length; const average = count ? scores.reduce((total, score) => total + score, 0) / count : 0; document.querySelector('[data-review-summary]').innerHTML = `${reviewStars(average)} <span class="review-count">(${count} reviews)</span>`; document.querySelector('.rating').innerHTML = `${reviewStars(average)} <small>(${count} reviews)</small>`; reviewItems.forEach((item, index) => { const rating = item.querySelector('.review-item-rating'); rating.innerHTML = `${reviewStars(scores[index])} <b>${scores[index].toFixed(1).replace('.', ',')}</b>`; }); }; updateReviewDisplay(); window.addEventListener('storage', (event) => { if (event.key === 'zf_employer_reviews') window.location.reload(); });</script>
<script>const actualReviewData = JSON.parse(localStorage.getItem('zf_employer_reviews') || 'null'); const demoReviewPage = new URLSearchParams(location.search).get('demo') === 'bedrijf'; if (!demoReviewPage && !(Array.isArray(actualReviewData) && actualReviewData.length)) { document.querySelector('[data-reviews-list]').innerHTML = ''; document.querySelector('[data-review-summary]').innerHTML = '<span class="stars-empty">★★★★★</span> <span class="review-count">(0 reviews)</span>'; document.querySelector('.rating').innerHTML = '<span class="stars-empty">★★★★★</span> <small>(0 reviews)</small>'; }</script>
<script>const reviewSidebarRoutes = { 'Jouw start': 'dashboard.html?demo=bedrijf&view=calendar', Klussen: 'dashboard.html?demo=bedrijf&view=jobs', Planning: 'dashboard.html?demo=bedrijf&view=calendar', Kandidaten: 'dashboard.html?demo=bedrijf&view=candidates', Favorieten: 'dashboard.html?demo=bedrijf&view=candidates&filter=favorites', Chat: 'communicatie.html?demo=bedrijf', Geblokkeerd: 'dashboard.html?demo=bedrijf&view=blocked', Instellingen: 'dashboard.html?demo=bedrijf&view=settings', Uitloggen: 'login.html?role=opdrachtgever' }; document.querySelectorAll('.sidebar [title]').forEach((button) => { const route = reviewSidebarRoutes[button.title]; if (route && button.tagName === 'BUTTON') button.addEventListener('click', () => { window.location.href = route; }); });</script>
<script>const accountButton = document.querySelector('.top-actions button:last-child'); const accountWrap = document.createElement('div'); accountWrap.className = 'account-wrap'; accountButton.className = 'account-button'; accountButton.setAttribute('aria-expanded', 'false'); accountButton.parentNode.insertBefore(accountWrap, accountButton); accountWrap.appendChild(accountButton); accountWrap.insertAdjacentHTML('beforeend', '<div class="account-menu" hidden><button type="button" data-account-choice="personal">Persoonlijke instellingen</button><button type="button" data-account-choice="notifications">Notificatievoorkeuren</button><button type="button" data-account-choice="logout">Uitloggen</button></div>'); const accountMenu = accountWrap.querySelector('.account-menu'); accountButton.addEventListener('click', (event) => { event.stopPropagation(); accountMenu.hidden = !accountMenu.hidden; accountButton.setAttribute('aria-expanded', String(!accountMenu.hidden)); }); document.addEventListener('click', (event) => { if (!accountWrap.contains(event.target)) { accountMenu.hidden = true; accountButton.setAttribute('aria-expanded', 'false'); } }); accountWrap.querySelector('[data-account-choice="personal"]').addEventListener('click', () => { window.location.href = 'dashboard.html?demo=bedrijf#settingsView'; }); accountWrap.querySelector('[data-account-choice="notifications"]').addEventListener('click', () => { window.location.href = 'dashboard.html?demo=bedrijf#settingsView'; }); accountWrap.querySelector('[data-account-choice="logout"]').addEventListener('click', () => { window.location.href = 'login.html?role=opdrachtgever'; });</script>
<script>const reliableAccountButton = document.querySelector('.account-button'); const reliableAccountMenu = document.querySelector('.account-menu'); document.addEventListener('click', (event) => { if (!event.target.closest('.account-button')) return; event.preventDefault(); event.stopImmediatePropagation(); reliableAccountMenu.hidden = !reliableAccountMenu.hidden; reliableAccountButton.setAttribute('aria-expanded', String(!reliableAccountMenu.hidden)); }, true);</script>
<script>document.addEventListener('click', (event) => { if (event.target.closest('[data-account-choice="notifications"]')) { event.preventDefault(); event.stopImmediatePropagation(); window.location.href = 'notifications.html'; } }, true);</script>
</html>
