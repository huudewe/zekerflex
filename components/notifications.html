<!DOCTYPE html>
<html lang="nl">
<head>
	<link rel="stylesheet" href="zf-atmosphere.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZekerFlex - Notificaties</title>
<link rel="icon" type="image/svg+xml" href="zekerflex-logo.jpeg">
<style>
:root{--navy:#11145f;--ink:#202027;--line:#e7e8ed;--aqua:#19c5b6}*{box-sizing:border-box}body{margin:0;background:#f8f9fc;color:var(--ink);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:220px;flex:0 0 220px;background:linear-gradient(#11145f,#0e1254);display:flex;flex-direction:column;align-items:stretch;padding:24px 10px}.brand{width:100%;height:34px;display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 8px;color:#fff;font-weight:700}.brand img{width:27px;background:#fff;border-radius:6px}.sidebar-toggle{height:30px;margin:0 0 8px;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer;font-weight:700}.sidebar-toggle svg{width:20px;height:20px;margin-right:8px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2}.sidebar-quick,.side-button{width:100%;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border:1px solid transparent;border-radius:9px;background:transparent;color:#d8d9fb;text-align:left;font-weight:700;cursor:pointer}.sidebar-quick svg,.side-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.sidebar-quick:hover,.side-button:hover,.side-button.active{background:#292e85;border-color:#5960b5;color:#fff}.side-nav{display:grid;gap:10px;padding-top:10px;border-top:1px solid #40458e}.sidebar-bottom{display:grid;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid #40458e}.workspace{min-width:0;flex:1}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.company-name{font-weight:700}.rating{margin-left:18px;color:#c9cad0;letter-spacing:2px;text-decoration:none}.rating small{color:#3897be;letter-spacing:0}.top-actions{display:flex;align-items:center;gap:12px}.top-actions select,.top-actions button{height:38px;border:1px solid #dedfe5;background:#fff;border-radius:5px;padding:0 13px;color:#555}.content{max-width:1260px;margin:auto;padding:38px 42px 72px}.page-head{padding:8px 0 34px}.page-head h1{margin:0 0 13px;color:#343b64;font-size:21px}.back-link{color:#3897be;font-size:12px;text-decoration:none}.notification-card{width:min(100%,520px);padding:28px 30px;background:#fff;border:1px solid #edf0f4;box-shadow:0 3px 16px rgba(37,48,90,.03)}.notification-card h2{margin:0 0 17px;color:#3f486f;font-size:17px;line-height:1.35}.notification-list{display:grid}.notification-row{display:flex;align-items:center;gap:16px;min-height:48px;border-top:1px solid #e5e8ed;color:#858b96;font-size:12px}.notification-row span{flex:1}.toggle{position:relative;width:31px;height:17px;border:0;border-radius:20px;background:#c9ced5;cursor:pointer}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s ease}.toggle.is-on{background:#2bc9ba}.toggle.is-on:after{transform:translateX(14px)}@media(max-width:600px){.sidebar{width:72px;flex-basis:72px;padding:18px 7px}.brand{padding:0;justify-content:center}.brand span,.sidebar-toggle span,.sidebar-quick:after,.side-button:after{display:none}.sidebar-toggle{text-align:center}.sidebar-quick,.side-button{width:52px;padding:0;justify-content:center}.content{padding:24px 16px}.topbar{padding:0 14px}.company-name{display:none}.rating{margin:0}.notification-card{padding:22px 18px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" aria-label="Werkgeversmenu"><a class="brand" href="dashboard.html?demo=bedrijf"><img src="zekerflex-logo.jpeg" alt="ZekerFlex"><span>ZekerFlex</span></a><button class="sidebar-toggle" type="button" aria-label="Zijbalk inklappen"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M10 12h8"></path></svg><span>Inklappen</span></button><button class="sidebar-quick" type="button" title="Jouw start"><svg viewBox="0 0 24 24"><path d="M14.5 4.5c2.4-1.1 4.3-1.1 5-1.1 0 .7 0 2.6-1.1 5l-7.8 7.8-3.6.4.4-3.6 7.1-8.5Z"></path><path d="m7 16-3 3M13 18l-1 3M6 11l-3 1"></path><circle cx="16.5" cy="7.5" r="1"></circle></svg><span>Jouw start</span></button><nav class="side-nav"><button class="side-button" title="Klussen"><span>▤</span><span>Klussen</span></button><button class="side-button" title="Planning"><span>□</span><span>Planning</span></button><button class="side-button" title="Favorieten"><span>♡</span><span>Favorieten</span></button><button class="side-button" title="Chat"><span>▱</span><span>Chat</span></button><button class="side-button" title="Geblokkeerd"><span>⊘</span><span>Geblokkeerd</span></button></nav><div class="sidebar-bottom"><button class="side-button active" title="Instellingen"><span>⚙</span><span>Instellingen</span></button><button class="side-button" title="Uitloggen"><span>↪</span><span>Uitloggen</span></button></div></aside><div class="workspace"><header class="topbar"><div><span class="company-name">Demo account</span><a class="rating" href="reviews.html">★★★★★ <small>(0 reviews)</small></a></div><div class="top-actions"><select aria-label="Taal"><option>Nederlands (NL)</option><option>English (EN)</option></select><button title="Help">?</button><button type="button" class="account-button" aria-expanded="false">Mijn account v</button></div></header><main class="content"><section class="page-head"><h1>NOTIFICATIES</h1><a class="back-link" href="dashboard.html?demo=bedrijf#settingsView">←&nbsp; Ga terug</a></section><section class="notification-card"><h2>Ik wil een e-mail ontvangen als een freelancer:</h2><div class="notification-list"><label class="notification-row"><span>Reageert op mijn klus</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Automatisch is geaccepteerd als match</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Zijn uurtarief wijzigt</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Zijn uren heeft ingediend</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Mijn tegenvoorstel accepteert</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Zijn persoonlijke gegevens aanpast</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Een vervanger heeft geregeld</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Een claim heeft ingediend</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Bijna 650 uur heeft gewerkt</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Zich afmeldt binnen de annuleringstermijn</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label><label class="notification-row"><span>Zich afmeldt buiten de annuleringstermijn</span><button class="toggle is-on" type="button" aria-pressed="true"></button></label></div></section></main></div></div>
<script>document.querySelectorAll('.toggle').forEach((toggle) => toggle.addEventListener('click', () => { const on = toggle.classList.toggle('is-on'); toggle.setAttribute('aria-pressed', String(on)); })); document.querySelector('.sidebar-toggle').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('is-expanded')); document.querySelector('.account-button').addEventListener('click', () => { const button = document.querySelector('.account-button'); if (document.querySelector('.account-menu')) { document.querySelector('.account-menu').remove(); return; } button.insertAdjacentHTML('afterend', '<div class="account-menu" style="position:absolute;z-index:10;right:28px;top:68px;display:grid;min-width:190px;padding:6px;background:#fff;border:1px solid #dfe1e7;border-radius:5px;box-shadow:0 5px 14px rgba(15,23,42,.12)"><a href="dashboard.html?demo=bedrijf#accountViewFixed" style="padding:10px;color:#596273;text-decoration:none;font-size:12px">Persoonlijke instellingen</a><a href="notifications.html" style="padding:10px;color:#596273;text-decoration:none;font-size:12px">Notificatievoorkeuren</a><a href="login.html?role=opdrachtgever" style="padding:10px;color:#596273;text-decoration:none;font-size:12px">Uitloggen</a></div>'); }); document.querySelectorAll('.sidebar [title]').forEach((button) => button.addEventListener('click', () => { const routes = { 'Jouw start':'dashboard.html?demo=bedrijf', Klussen:'dashboard.html?demo=bedrijf&view=jobs', Planning:'dashboard.html?demo=bedrijf&view=calendar', Favorieten:'dashboard.html?demo=bedrijf&view=candidates&filter=favorites', Chat:'communicatie.html?demo=bedrijf', Geblokkeerd:'dashboard.html?demo=bedrijf&view=blocked', Instellingen:'dashboard.html?demo=bedrijf&view=settings', Uitloggen:'login.html?role=opdrachtgever' }; if (routes[button.title]) location.href = routes[button.title]; }));</script>
</body>
</html>
